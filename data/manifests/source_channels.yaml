# Primary source channels for corpus acquisition.
# See DATA_STATEMENT.md for release posture.

channels:
  - name: FencingVision
    url: "https://www.youtube.com/@FencingVision"
    description: >
      Uncut individual and team fencing bouts from FIE World Cups, Grand Prix,
      and European Championships. Standardized score overlay (red=left,
      green=right). No slow-motion replays in non-podium videos.
    overlay:
      format: "red_green"
      red_side: left
      green_side: right
    exclusion_rules:
      - "Avoid videos with 'podium', 'final', 'semi-final' in the title (slow-mo replays)"
      - "Prefer T16, T32, T64, Pool round videos (uncut, no replays)"
    title_format: >
      YEAR EVENT_NUM ROUND MATCH_NUM GENDER WEAPON FORMAT CITY COUNTRY [COLOR] ATHLETE1 COUNTRY1 vs ATHLETE2 COUNTRY2
    title_parsing:
      weapon_codes:
        F: foil
        S: sabre
        E: epee
      gender_codes:
        M: men
        F: women
      round_codes: ["T64", "T32", "T16", "T08", "Pool"]
    playlists:
      - name: "2025 Shanghai Foil Grand Prix"
        url: "https://www.youtube.com/playlist?list=PL_pQQho0KExxUCEFLJk-CZwtwUBllOEFO"
        weapon: foil
      - name: "2025 Seoul Sabre Grand Prix"
        url: "https://www.youtube.com/playlist?list=PL_pQQho0KExzoSuflHpPXjOKeIO0z_day"
        weapon: sabre
      - name: "2025 Bogota Epee Grand Prix"
        url: "https://www.youtube.com/playlist?list=PL_pQQho0KExzEf7OBcwUoJd6kVqhsvZtQ"
        weapon: epee
      - name: "2025 Torino Foil Grand Prix"
        url: "https://www.youtube.com/playlist?list=PL_pQQho0KExxpUJ5bKDjIBYXRea-BybEB"
        weapon: foil
      - name: "2025 Plovdiv Men Sabre World Cup"
        url: "https://www.youtube.com/playlist?list=PL_pQQho0KExxUgUc1e0HQLlY601QOvEyr"
        weapon: sabre
      - name: "2025 Budapest Epee Grand Prix"
        url: "https://www.youtube.com/playlist?list=PL_pQQho0KExxz9R4YLeLympMhVQ7ZkGeo"
        weapon: epee
