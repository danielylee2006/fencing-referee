# Primary source channels for corpus acquisition.
# See DATA_STATEMENT.md for release posture.

channels:
  - name: FencingVision
    url: "https://www.youtube.com/@FencingVision"
    description: >
      Uncut individual and team fencing bouts from FIE World Cups, Grand Prix,
      and European Championships. Standardized score overlay (red=left,
      green=right). No slow-motion replays in non-podium videos.
    overlay:
      format: "red_green"
      red_side: left
      green_side: right
    exclusion_rules:
      - "Avoid videos with 'podium', 'final', 'semi-final' in the title (slow-mo replays)"
      - "Prefer T16, T32, T64, Pool round videos (uncut, no replays)"
    title_format: >
      YEAR EVENT_NUM ROUND MATCH_NUM GENDER WEAPON FORMAT CITY COUNTRY [COLOR] ATHLETE1 COUNTRY1 vs ATHLETE2 COUNTRY2
    title_parsing:
      weapon_codes:
        F: foil
        S: sabre
        E: epee
      gender_codes:
        M: men
        F: women
      round_codes: ["T64", "T32", "T16", "T08", "Pool"]
    playlists:
      # Foil only for P0/P1. Sabre and epee deferred to P3/P7 — FencingVision
      # uses a different (non-blue) overlay for sabre/epee that needs separate
      # detection work.
      #
      # Only playlists with old (dark blue) overlay AND visible clock:
      # Excluded:
      #   - 2025 Torino Foil (new grey overlay)
      #   - 2023 Shanghai Foil (old overlay but no clock — can't detect blade tests)
      #   - All sabre playlists (different overlay color, not blue-dominant)
      #   - All epee playlists (different overlay color, not blue-dominant)
      #
      # 2025 Shanghai Foil is mixed overlay — the is_old_overlay() gate rejects
      # individual videos that use the new overlay.

      # --- FOIL (3 playlists) ---
      - name: "2025 Shanghai Foil Grand Prix"
        url: "https://www.youtube.com/playlist?list=PL_pQQho0KExxUCEFLJk-CZwtwUBllOEFO"
        weapon: foil
      - name: "2024 Shanghai Foil Grand Prix"
        url: "https://www.youtube.com/playlist?list=PL_pQQho0KExyI_55Y8J89niiHyKn-f_nM"
        weapon: foil
      - name: "2024 Torino Foil Grand Prix"
        url: "https://www.youtube.com/playlist?list=PL_pQQho0KExyRZRPRLvfkuSqV0073VuUq"
        weapon: foil
