# Each clip is one exchange, timestamps auto-detected by scripts/extract_exchanges.py.
# Source: FencingVision YouTube channel (uncut bouts, standardized overlay).
# https://www.youtube.com/@FencingVision
#
# Clip = 2 seconds before light onset → 0.5 seconds after score update.
# Equipment tests (light but no score change) are automatically filtered.
#
# Overlay convention: red score = left fencer, green score = right fencer.

