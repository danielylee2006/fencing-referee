name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff + mypy --strict)
        run: |
          uv run ruff check src/a1 tests
          uv run ruff format --check src/a1 tests
          uv run mypy --strict src/a1

      - name: Test (full failure list in CI)
        run: uv run pytest tests/ --tb=short

      - name: Check for lockfile/format drift
        run: git diff --exit-code
